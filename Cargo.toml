[package]
name = "upkg"
version = "0.1.0"
edition = "2021"
description = "UPKG - Universal Package Format & CLI"
license = "GPL-3.0-only"

[dependencies]
sha1 = "0.10"
zstd = "0.13"
ed25519-dalek = "2"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
ureq = "2"

[profile.release]
lto = true
